name: Docker Build (Fork)

on:
  release:
    types:
      - 'published'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Install Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install --locked wasm-pack

      - name: Build frontend
        run: ./app/build.sh

      - name: Upload UI artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ui
          path: app/

  build-bin:
    runs-on: ubuntu-latest
    needs: build-ui
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: amd64-binaries
          - target: aarch64-unknown-linux-musl
            artifact: arm64-binaries
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Install Rust
        id: toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Build binaries
        run: cross build --release --target ${{ matrix.target }} -p lldap -p lldap_migration_tool -p lldap_set_password

      - name: Prepare binaries
        run: |
          mkdir -p bin
          cp target/${{ matrix.target }}/release/lldap bin/
          cp target/${{ matrix.target }}/release/lldap_migration_tool bin/
          cp target/${{ matrix.target }}/release/lldap_set_password bin/

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: bin/

  build-docker:
    runs-on: ubuntu-latest
    needs: [build-ui, build-bin]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Download UI artifacts
        uses: actions/download-artifact@v8
        with:
          name: ui
          path: web/

      - name: Download amd64 binaries
        uses: actions/download-artifact@v8
        with:
          name: amd64-binaries
          path: bin/amd64/

      - name: Download arm64 binaries
        uses: actions/download-artifact@v8
        with:
          name: arm64-binaries
          path: bin/arm64/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mitch-lldap
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=latest
            type=sha,format=short
            type=raw,value={{date 'YYYY-MM-DD'}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          file: ./.github/workflows/Dockerfile.ci.multiarch
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
